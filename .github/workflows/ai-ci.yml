name: AI service CI
on:
  push:
    branches: [main]
    paths: ['ai-service/**', '.github/workflows/ai-ci.yml']
  pull_request:
    paths: ['ai-service/**', '.github/workflows/ai-ci.yml']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    name: Audit Python dependencies (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements-dev.txt, requirements-rag.txt, requirements-audit.txt]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Install pinned audit tooling
        run: python -m pip install -r requirements-audit.txt
      - name: Check resolved dependencies against vulnerability advisories
        run: python -m pip_audit --strict --progress-spinner off --timeout 30 -r "${{ matrix.requirements }}"

  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: ai-service
    env:
      AI_RAG_ENABLED: 'false'
      GROQ_API_KEY: ''
      AI_SERVICE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Run offline tests (external network forbidden by conftest)
        run: python -m pytest -q
      - name: Build minimal production image
        if: matrix.python-version == '3.12'
        working-directory: .
        run: docker build --tag secure-healthcare-ai:ci ./ai-service

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-nonmajor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-nonmajor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-nonmajor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-nonmajor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      frontend-images:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      backend-images:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      ai-images:
        patterns: ['*']

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
  <title id="title">Medicare application architecture</title>
  <desc id="description">Browsers access the React application through a same-origin API proxy. Express applies session, role, care-context and consent checks before database and file operations. Uploads are scanned before encryption. Audit evidence is retained in PostgreSQL. SMTP delivery and AI intake are separately configured integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#087f78"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 17px; fill: #183c3d; font-weight: 600; }
      .detail { font-size: 14px; fill: #526f73; }
      .section { font-size: 12px; fill: #087f78; font-weight: 700; letter-spacing: 1.3px; }
      .box { fill: #fff; stroke: #d1e2df; stroke-width: 1.5; }
      .line { fill: none; stroke: #087f78; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="650" rx="20" fill="#f5faf8"/>
  <text class="section" x="32" y="36">REQUEST PATH</text>
  <rect class="box" x="32" y="62" width="200" height="88" rx="12"/>
  <text class="label" x="132" y="99" text-anchor="middle">Browsers</text>
  <text class="detail" x="132" y="124" text-anchor="middle">Patients and care teams</text>
  <path class="line" d="M232 106H301"/>
  <rect class="box" x="312" y="62" width="200" height="88" rx="12"/>
  <text class="label" x="412" y="99" text-anchor="middle">React application</text>
  <text class="detail" x="412" y="124" text-anchor="middle">Shared Medicare interface</text>
  <path class="line" d="M512 106H581"/>
  <rect class="box" x="592" y="62" width="200" height="88" rx="12"/>
  <text class="label" x="692" y="99" text-anchor="middle">Same-origin proxy</text>
  <text class="detail" x="692" y="124" text-anchor="middle">Vercel or nginx · /api</text>
  <path class="line" d="M792 106H861"/>
  <rect x="872" y="62" width="216" height="88" rx="12" fill="#087f78"/>
  <text x="980" y="99" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">Express API</text>
  <text x="980" y="124" text-anchor="middle" fill="#e2f2ed" font-size="14">Node.js 24</text>

  <path class="line" d="M980 150V187"/>
  <rect x="752" y="198" width="336" height="78" rx="12" fill="#e2f2ed" stroke="#087f78" stroke-width="1.5"/>
  <text class="label" x="920" y="228" text-anchor="middle">Authorization and consent</text>
  <text class="detail" x="920" y="253" text-anchor="middle">Session · role · ownership · active care</text>

  <text class="section" x="32" y="276">PROTECTED OPERATIONS</text>
  <path d="M920 276V302M163 302H947" fill="none" stroke="#087f78" stroke-width="2"/>
  <path class="line" d="M163 302V330"/>
  <path class="line" d="M555 302V330"/>
  <path class="line" d="M947 302V330"/>
  <rect class="box" x="32" y="342" width="262" height="100" rx="12"/>
  <text class="label" x="163" y="374" text-anchor="middle">PostgreSQL</text>
  <text class="detail" x="163" y="399" text-anchor="middle">Records, visits and governance</text>
  <text class="detail" x="163" y="422" text-anchor="middle">Restricted runtime database role</text>
  <rect class="box" x="414" y="342" width="282" height="100" rx="12"/>
  <text class="label" x="555" y="374" text-anchor="middle">Protected file storage</text>
  <text class="detail" x="555" y="399" text-anchor="middle">ClamAV scanning before persistence</text>
  <text class="detail" x="555" y="422" text-anchor="middle">AES-256-GCM encrypted files</text>
  <rect class="box" x="806" y="342" width="282" height="100" rx="12"/>
  <text class="label" x="947" y="374" text-anchor="middle">Audit evidence</text>
  <text class="detail" x="947" y="399" text-anchor="middle">Protected reads and changes</text>
  <text class="detail" x="947" y="422" text-anchor="middle">Retained in PostgreSQL</text>

  <rect x="32" y="486" width="1056" height="136" rx="12" fill="#fff" stroke="#b5ceca" stroke-dasharray="5 5"/>
  <text class="section" x="56" y="513">SEPARATELY CONFIGURED API INTEGRATIONS</text>
  <text class="label" x="56" y="550">SMTP delivery</text>
  <text class="detail" x="56" y="577">Email verification and staff invitations</text>
  <path d="M554 535V597" stroke="#d1e2df"/>
  <text class="label" x="584" y="550">AI intake service</text>
  <text class="detail" x="584" y="577">Optional · disabled until explicitly configured</text>
  <text class="detail" x="56" y="603">Production transport uses HTTPS and certificate-verified database TLS.</text>
</svg>
